name: ch-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟一次(GitHub 允许的最短间隔,实际可能延迟)
  workflow_dispatch:         # 允许在网页上手动点"Run workflow"

permissions:
  contents: write            # 用来把状态文件存回仓库

concurrency:
  group: ch-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for new drops
        run: python ch_monitor.py --once
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain ch_state.json)" ]; then
            git config user.name "ch-monitor-bot"
            git config user.email "ch-monitor-bot@users.noreply.github.com"
            git add ch_state.json
            git commit -m "update state"
            git push
          fi
